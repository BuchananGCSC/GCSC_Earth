# Publish the static site to GitHub Pages on every push to main.
# No build step: the files are copied as-is. Phase 0 is served at /phase0/;
# the site root redirects there until the real app takes its place.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r phase0 _site/phase0
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>Geoscience Globe</title>
          <meta http-equiv="refresh" content="0; url=phase0/">
          <p><a href="phase0/">Geoscience Globe — Phase 0 check</a></p>
          HTML
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
